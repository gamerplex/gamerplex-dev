<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gamerplex — Invaders</title>
<style>
* { margin: 0; padding: 0; }
body { background: #0a0a0f; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
canvas { image-rendering: pixelated; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const W = 768, H = 600;
const c = document.getElementById("c");
c.width = W; c.height = H;
const ctx = c.getContext("2d");
ctx.imageSmoothingEnabled = false;

const bus = { _h: {}, on(e,f){ (this._h[e]??=[]).push(f); }, emit(e,...a){ (this._h[e]??[]).forEach(f=>f(...a)); }};

const audio = {
  ctx: null,
  init() {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!this.ctx && AC) this.ctx = new AC();
    if (this.ctx && this.ctx.state === "suspended") this.ctx.resume();
  },
  tone(freq, dur, type = "square", vol = 0.12, slide = 0) {
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t);
    if (slide) osc.frequency.exponentialRampToValueAtTime(Math.max(20, freq + slide), t + dur);
    gain.gain.setValueAtTime(vol, t);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(gain).connect(this.ctx.destination);
    osc.start(t);
    osc.stop(t + dur);
  },
  noise(dur, vol = 0.25) {
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    const len = Math.max(1, Math.floor(this.ctx.sampleRate * dur));
    const buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = this.ctx.createBufferSource();
    src.buffer = buf;
    const gain = this.ctx.createGain();
    gain.gain.value = vol;
    src.connect(gain).connect(this.ctx.destination);
    src.start(t);
  },
};
addEventListener("keydown", () => audio.init(), { once: true });
addEventListener("pointerdown", () => audio.init(), { once: true });

const particles = [];
function spawnBurst(x, y, count, color) {
  for (let i = 0; i < count; i++) {
    const a = Math.random() * Math.PI * 2;
    const s = 80 + Math.random() * 180;
    particles.push({
      x, y,
      vx: Math.cos(a) * s,
      vy: Math.sin(a) * s - 40,
      life: 0.35 + Math.random() * 0.35,
      age: 0,
      color,
      size: 2 + Math.floor(Math.random() * 2),
    });
  }
}
function updateParticles(dt) {
  for (const p of particles) {
    p.age += dt;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vy += 260 * dt;
    p.vx *= 0.98;
  }
  for (let i = particles.length - 1; i >= 0; i--) {
    if (particles[i].age >= particles[i].life) particles.splice(i, 1);
  }
}
function drawParticles() {
  for (const p of particles) {
    const a = 1 - p.age / p.life;
    ctx.globalAlpha = Math.max(0, a);
    ctx.fillStyle = p.color;
    ctx.fillRect(Math.floor(p.x), Math.floor(p.y), p.size, p.size);
  }
  ctx.globalAlpha = 1;
}

const camera = { shake: 0, shakeDuration: 0 };
function addShake(mag, dur) {
  if (mag > camera.shake) camera.shake = mag;
  if (dur > camera.shakeDuration) camera.shakeDuration = dur;
}
function updateCamera(dt) {
  if (camera.shakeDuration > 0) {
    camera.shakeDuration -= dt;
    if (camera.shakeDuration <= 0) { camera.shakeDuration = 0; camera.shake = 0; }
  }
}

bus.on("alien:killed", ({ x, y }) => {
  spawnBurst(x + spriteW / 2, y + spriteH / 2, 14, "#2bff4f");
  audio.tone(320, 0.12, "square", 0.14, -220);
  addShake(2, 0.08);
});
bus.on("player:fire", () => {
  audio.tone(880, 0.09, "square", 0.1, -520);
});
bus.on("enemy:fire", () => {
  audio.tone(220, 0.1, "sawtooth", 0.08, -100);
});
bus.on("player:hit", ({ x, y }) => {
  spawnBurst(x + CFG.PLAYER_W / 2, y + CFG.PLAYER_H / 2, 22, "#ff4a4a");
  audio.noise(0.35, 0.35);
  audio.tone(90, 0.4, "sawtooth", 0.2, -40);
  addShake(12, 0.45);
});
bus.on("player:died", () => {
  addShake(16, 0.6);
  audio.tone(200, 0.6, "sawtooth", 0.25, -180);
});
bus.on("game:won", () => {
  audio.tone(523, 0.12, "square", 0.15);
  setTimeout(() => audio.tone(659, 0.12, "square", 0.15), 120);
  setTimeout(() => audio.tone(784, 0.2, "square", 0.15), 240);
});
bus.on("aliens:drop", () => {
  audio.tone(140, 0.06, "square", 0.08);
});

const CFG = {
  ROWS: 5,
  COLS: 11,
  PX: 3,
  SPRITE_W: 11,
  SPRITE_H: 8,
  COL_GAP: 15,
  ROW_GAP: 16,
  START_Y: 70,
  EDGE_MARGIN: 16,
  STEP_X: 4,
  STEP_Y: 16,
  BASE_INTERVAL: 0.85,
  MIN_INTERVAL: 0.05,
  ALIEN_COLOR: "#2bff4f",
  PLAYER_W: 36,
  PLAYER_H: 18,
  PLAYER_Y: 550,
  PLAYER_COLOR: "#e8e8ef",
  BULLET_W: 3,
  BULLET_H: 12,
  BULLET_SPEED: 520,
  BULLET_COOLDOWN: 0.28,
  SCORE_PER_KILL: 10,
  ENEMY_BULLET_W: 3,
  ENEMY_BULLET_H: 10,
  ENEMY_BULLET_SPEED: 240,
  ENEMY_FIRE_INTERVAL: 1.1,
  ENEMY_BULLET_COLOR: "#ff4a4a",
  START_LIVES: 3,
  RESPAWN_INVULN: 1.5,
};

const SPRITE_A = [
  "..X.....X..",
  "...X...X...",
  "..XXXXXXX..",
  ".XX.XXX.XX.",
  "XXXXXXXXXXX",
  "X.XXXXXXX.X",
  "X.X.....X.X",
  "...XX.XX...",
];
const SPRITE_B = [
  "..X.....X..",
  "X..X...X..X",
  "X.XXXXXXX.X",
  "XXX.XXX.XXX",
  "XXXXXXXXXXX",
  ".XXXXXXXXX.",
  "..X.....X..",
  ".X.......X.",
];

const spriteW = CFG.SPRITE_W * CFG.PX;
const spriteH = CFG.SPRITE_H * CFG.PX;
const cellW = spriteW + CFG.COL_GAP;
const cellH = spriteH + CFG.ROW_GAP;
const totalW = CFG.COLS * cellW - CFG.COL_GAP;
const startX = Math.floor((W - totalW) / 2);

const aliens = [];
for (let r = 0; r < CFG.ROWS; r++) {
  for (let col = 0; col < CFG.COLS; col++) {
    aliens.push({ row: r, col, alive: true });
  }
}

const formation = { ox: 0, oy: 0, dir: 1, frame: 0, timer: 0 };

const player = { x: Math.floor((W - CFG.PLAYER_W) / 2), y: CFG.PLAYER_Y, cooldown: 0, invuln: 0 };
const bullets = [];
const enemyBullets = [];
let enemyFireTimer = 0;
let score = 0;
let lives = CFG.START_LIVES;
let gameOver = false;
let won = false;

const input = { fire: false };
addEventListener("keydown", e => {
  if (e.code === "Space") {
    if (gameOver || won) restartGame();
    else input.fire = true;
    e.preventDefault();
  }
});
addEventListener("keyup", e => { if (e.code === "Space") input.fire = false; });

function restartGame() {
  for (const a of aliens) a.alive = true;
  formation.ox = 0; formation.oy = 0; formation.dir = 1; formation.frame = 0; formation.timer = 0;
  bullets.length = 0;
  enemyBullets.length = 0;
  enemyFireTimer = 0;
  score = 0;
  lives = CFG.START_LIVES;
  gameOver = false;
  won = false;
  player.x = Math.floor((W - CFG.PLAYER_W) / 2);
  player.cooldown = 0;
  player.invuln = 0;
  input.fire = false;
}

function fireBullet() {
  bullets.push({
    x: player.x + Math.floor(CFG.PLAYER_W / 2) - Math.floor(CFG.BULLET_W / 2),
    y: player.y - CFG.BULLET_H,
    alive: true,
  });
  player.cooldown = CFG.BULLET_COOLDOWN;
  bus.emit("player:fire", {});
}

function rectsOverlap(ax, ay, aw, ah, bx, by, bw, bh) {
  return ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by;
}

function aliveCount() { let n = 0; for (const a of aliens) if (a.alive) n++; return n; }

function stepInterval() {
  const total = CFG.ROWS * CFG.COLS;
  const n = aliveCount();
  if (n <= 1) return CFG.MIN_INTERVAL;
  const t = (n - 1) / (total - 1);
  return CFG.MIN_INTERVAL + t * (CFG.BASE_INTERVAL - CFG.MIN_INTERVAL);
}

function alienX(a, ox) { return startX + a.col * cellW + ox; }
function alienY(a, oy) { return CFG.START_Y + a.row * cellH + oy; }

function fireEnemyBullet() {
  const shooters = {};
  for (const a of aliens) {
    if (!a.alive) continue;
    const prev = shooters[a.col];
    if (!prev || a.row > prev.row) shooters[a.col] = a;
  }
  const list = Object.values(shooters);
  if (list.length === 0) return;
  const a = list[Math.floor(Math.random() * list.length)];
  const ax = alienX(a, formation.ox) + Math.floor(spriteW / 2) - Math.floor(CFG.ENEMY_BULLET_W / 2);
  const ay = alienY(a, formation.oy) + spriteH;
  enemyBullets.push({ x: ax, y: ay, alive: true });
  bus.emit("enemy:fire", { x: ax, y: ay });
}

function resetRound() {
  player.x = Math.floor((W - CFG.PLAYER_W) / 2);
  player.cooldown = 0;
  player.invuln = CFG.RESPAWN_INVULN;
  enemyBullets.length = 0;
  bullets.length = 0;
}

function update(dt) {
  updateParticles(dt);
  updateCamera(dt);
  if (gameOver || won) return;
  player.cooldown = Math.max(0, player.cooldown - dt);
  player.invuln = Math.max(0, player.invuln - dt);
  if (input.fire && player.cooldown === 0) fireBullet();

  for (const b of bullets) {
    if (!b.alive) continue;
    b.y -= CFG.BULLET_SPEED * dt;
    if (b.y + CFG.BULLET_H < 0) { b.alive = false; continue; }
    for (const a of aliens) {
      if (!a.alive) continue;
      const ax = alienX(a, formation.ox);
      const ay = alienY(a, formation.oy);
      if (rectsOverlap(b.x, b.y, CFG.BULLET_W, CFG.BULLET_H, ax, ay, spriteW, spriteH)) {
        a.alive = false;
        b.alive = false;
        score += CFG.SCORE_PER_KILL;
        bus.emit("alien:killed", { x: ax, y: ay });
        break;
      }
    }
  }
  for (let i = bullets.length - 1; i >= 0; i--) if (!bullets[i].alive) bullets.splice(i, 1);

  if (aliveCount() === 0) {
    won = true;
    bus.emit("game:won", { score });
    return;
  }

  enemyFireTimer += dt;
  if (enemyFireTimer >= CFG.ENEMY_FIRE_INTERVAL) {
    enemyFireTimer = 0;
    if (aliveCount() > 0) fireEnemyBullet();
  }

  for (const b of enemyBullets) {
    if (!b.alive) continue;
    b.y += CFG.ENEMY_BULLET_SPEED * dt;
    if (b.y > H) { b.alive = false; continue; }
    if (player.invuln === 0 && rectsOverlap(b.x, b.y, CFG.ENEMY_BULLET_W, CFG.ENEMY_BULLET_H, player.x, player.y, CFG.PLAYER_W, CFG.PLAYER_H)) {
      b.alive = false;
      lives--;
      bus.emit("player:hit", { x: player.x, y: player.y, lives });
      if (lives <= 0) {
        gameOver = true;
        bus.emit("player:died", { score });
      } else {
        resetRound();
      }
      break;
    }
  }
  for (let i = enemyBullets.length - 1; i >= 0; i--) if (!enemyBullets[i].alive) enemyBullets.splice(i, 1);

  formation.timer += dt;
  const interval = stepInterval();
  while (formation.timer >= interval) {
    formation.timer -= interval;
    formation.frame ^= 1;

    const nextOx = formation.ox + CFG.STEP_X * formation.dir;
    let minX = Infinity, maxX = -Infinity;
    for (const a of aliens) {
      if (!a.alive) continue;
      const x = alienX(a, nextOx);
      if (x < minX) minX = x;
      if (x + spriteW > maxX) maxX = x + spriteW;
    }
    if (minX < CFG.EDGE_MARGIN || maxX > W - CFG.EDGE_MARGIN) {
      formation.dir *= -1;
      formation.oy += CFG.STEP_Y;
      bus.emit("aliens:drop", { oy: formation.oy });
    } else {
      formation.ox = nextOx;
    }
  }
}

function drawAlien(x, y, frame) {
  const sprite = frame === 0 ? SPRITE_A : SPRITE_B;
  ctx.fillStyle = CFG.ALIEN_COLOR;
  const px = CFG.PX;
  for (let row = 0; row < sprite.length; row++) {
    const line = sprite[row];
    for (let col = 0; col < line.length; col++) {
      if (line[col] === "X") {
        ctx.fillRect(Math.floor(x + col * px), Math.floor(y + row * px), px, px);
      }
    }
  }
}

function drawPlayer() {
  if (player.invuln > 0 && Math.floor(player.invuln * 20) % 2 === 0) return;
  ctx.fillStyle = CFG.PLAYER_COLOR;
  const x = player.x, y = player.y, w = CFG.PLAYER_W, h = CFG.PLAYER_H;
  ctx.fillRect(x, y + 6, w, h - 6);
  ctx.fillRect(x + 6, y + 3, w - 12, 3);
  ctx.fillRect(x + Math.floor(w / 2) - 2, y, 4, 6);
}

function drawLifeIcon(x, y) {
  ctx.fillStyle = CFG.PLAYER_COLOR;
  const w = 18, h = 9;
  ctx.fillRect(x, y + 3, w, h - 3);
  ctx.fillRect(x + 3, y + 1, w - 6, 2);
  ctx.fillRect(x + Math.floor(w / 2) - 1, y, 2, 3);
}

function render() {
  ctx.fillStyle = "#0a0a0f";
  ctx.fillRect(0, 0, W, H);
  let sx = 0, sy = 0;
  if (camera.shake > 0 && camera.shakeDuration > 0) {
    sx = (Math.random() * 2 - 1) * camera.shake;
    sy = (Math.random() * 2 - 1) * camera.shake;
  }
  ctx.save();
  ctx.translate(sx, sy);
  for (const a of aliens) {
    if (!a.alive) continue;
    drawAlien(alienX(a, formation.ox), alienY(a, formation.oy), formation.frame);
  }
  drawPlayer();
  ctx.fillStyle = "#ffffff";
  for (const b of bullets) {
    ctx.fillRect(Math.floor(b.x), Math.floor(b.y), CFG.BULLET_W, CFG.BULLET_H);
  }
  ctx.fillStyle = CFG.ENEMY_BULLET_COLOR;
  for (const b of enemyBullets) {
    ctx.fillRect(Math.floor(b.x), Math.floor(b.y), CFG.ENEMY_BULLET_W, CFG.ENEMY_BULLET_H);
  }
  drawParticles();
  ctx.restore();
  ctx.fillStyle = "#e8e8ef";
  ctx.font = "20px monospace";
  ctx.textBaseline = "top";
  ctx.fillText("SCORE " + String(score).padStart(4, "0"), 16, 12);
  ctx.fillText("LIVES", W - 170, 12);
  for (let i = 0; i < lives; i++) {
    drawLifeIcon(W - 90 + i * 24, 16);
  }
  if (gameOver || won) {
    ctx.fillStyle = "rgba(10, 10, 15, 0.7)";
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = won ? "#2bff4f" : "#ff4a4a";
    ctx.font = "48px monospace";
    ctx.textAlign = "center";
    ctx.fillText(won ? "YOU WIN" : "GAME OVER", W / 2, H / 2 - 60);
    ctx.fillStyle = "#e8e8ef";
    ctx.font = "24px monospace";
    ctx.fillText("FINAL SCORE " + String(score).padStart(4, "0"), W / 2, H / 2);
    ctx.font = "18px monospace";
    ctx.fillText("Press SPACE to restart", W / 2, H / 2 + 40);
    ctx.textAlign = "start";
  }
}

const TICK = 1000 / 60;
let previous = performance.now();
let lag = 0;
function gameLoop(current) {
  const elapsed = Math.min(current - previous, 1000);
  previous = current;
  lag += elapsed;
  while (lag >= TICK) {
    update(TICK / 1000);
    lag -= TICK;
  }
  render();
  requestAnimationFrame(gameLoop);
}
requestAnimationFrame(gameLoop);
</script>
</body>
</html>
